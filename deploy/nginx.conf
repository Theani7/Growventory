server {
    listen 80;
    server_name _;

    # Maximum upload size for plant photos
    client_max_body_size 10M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Frontend - Vite Hashed Assets (JS, CSS)
    location /assets/ {
        root /home/ubuntu/Growventory/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Frontend - Static Images, Icons, and Fonts
    location ~* \.(?:webp|png|jpe?g|svg|ico|gif|woff2?)$ {
        root /home/ubuntu/Growventory/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Frontend - React SPA (index.html never cached so deploys update immediately)
    location = /index.html {
        root /home/ubuntu/Growventory/frontend/dist;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        root /home/ubuntu/Growventory/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Backend API - Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads - Plant Photos
    location /uploads/ {
        alias /home/ubuntu/Growventory/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
